# .github/workflows/release.yml
#
# Tag-only publication smoke. A release tag is accepted only
# when its commit is the exact commit recorded by a successful
# Release Candidate Gate workflow. Legacy commit-status contexts
# are intentionally not used as the release gate.
#
# The package and smoke matrix remains cross-platform so the
# published archives are built and exercised on all target OSes.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  verify-release-evidence:
    name: Verify exact candidate evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve successful candidate workflow for this SHA
        id: candidate
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release-candidate.yml",
              event: "push",
              status: "completed",
              per_page: 100
            });
            const candidate = runs.find((run) => run.head_sha === context.sha && run.conclusion === "success");
            if (!candidate) {
              core.setFailed(`no successful release-candidate.yml run verifies ${context.sha}`);
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: candidate.id,
              per_page: 100
            });
            const evidence = artifacts.find((artifact) => artifact.name === `release-evidence-${context.sha}` && !artifact.expired);
            if (!evidence) {
              core.setFailed(`candidate run ${candidate.id} has no release evidence artifact for ${context.sha}`);
              return;
            }
            core.setOutput("run_id", String(candidate.id));
            core.setOutput("workflow_url", candidate.html_url);
            core.setOutput("conclusion", candidate.conclusion);

      - name: Download release evidence artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          name: release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence

      - name: Download per-platform matrix archives
        # v1.1.6 (Task 11 / Phase 3 follow-up): the
        # v1.1.3 GATE-04 strict verifier's
        # CHECKSUM_BYTES_MISMATCH check (scripts/verify-release-evidence.mjs:123)
        # resolves `artifact.name` relative to
        # `dirname(evidencePath)` and reads the actual
        # bytes to confirm the sha256. The rc-gate's
        # matrix leg uploads the per-platform archive
        # (`agent-recall-<canon>.<ext>`) as part of the
        # `release-evidence-fragment-matrix-v113-<os>`
        # artifact, NOT as part of the
        # `release-evidence-<sha>` aggregate. Without
        # this download, the verifier fails on the
        # `existsSync` check with
        # `artifact bytes differ: agent-recall-<canon>.<ext>`.
        # We download the 3 matrix fragment artifacts
        # into the same `${{ runner.temp }}/release-evidence/`
        # directory so the per-platform `agent-recall-*`
        # files land next to `release-evidence.json` and
        # the verifier's path resolution finds them.
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          pattern: release-evidence-fragment-matrix-v113-*
          path: ${{ runner.temp }}/release-evidence
          merge-multiple: true

      - name: Verify tag commit SHA equals candidate SHA
        shell: bash
        env:
          CANDIDATE_WORKFLOW_URL: ${{ steps.candidate.outputs.workflow_url }}
          CANDIDATE_CONCLUSION: ${{ steps.candidate.outputs.conclusion }}
        run: |
          set -euo pipefail
          tag_commit_sha="$(git rev-parse HEAD)"
          candidate_sha="$(node -e 'const fs=require("node:fs"); const p=process.argv[1]; const e=JSON.parse(fs.readFileSync(p,"utf8")); process.stdout.write(e.release_commit);' "$RUNNER_TEMP/release-evidence/release-candidate.json")"
          if [ "$tag_commit_sha" != "$GITHUB_SHA" ]; then
            echo "tag_commit_sha does not equal GITHUB_SHA"
            exit 1
          fi
          if [ "$tag_commit_sha" != "$candidate_sha" ]; then
            echo "tag_commit_sha does not equal verified candidate release_commit"
            exit 1
          fi
          test -n "$CANDIDATE_WORKFLOW_URL"
          test "$CANDIDATE_CONCLUSION" = success

      - name: Verify release-evidence.json contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        # v1.1.5 (v1.1.5 release): the
        # `verify-release-evidence.mjs` script
        # imports `zod` (and `canonical-platforms.mjs`)
        # from `node_modules/`. Pre-fix the
        # `verify-release-evidence` job checked out
        # the tag commit + set up Node 24 but did NOT
        # install the workspace's npm dependencies,
        # so the verifier always crashed with
        # `ERR_MODULE_NOT_FOUND: 'zod'` and the
        # v* tag was blocked at the very first gate.
        # The `package` / `verify-extracted-artifacts` /
        # `smoke` matrix jobs install their own
        # dependencies later, so this step is
        # local to the verifier job.
        run: npm ci

      - name: Run evidence verifier
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/verify-release-evidence.mjs --stable --evidence "$RUNNER_TEMP/release-evidence/release-evidence.json"
          node -e 'const fs=require("node:fs"); const e=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(e.release_commit!==process.env.GITHUB_SHA || e.candidate_sha!==process.env.GITHUB_SHA) process.exit(1)' "$RUNNER_TEMP/release-evidence/release-evidence.json"

  package:
    needs: verify-release-evidence

    name: Package ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24"
            archive: tar
            suffix: linux-x64
          - os: macos-latest
            node: "24"
            archive: tar
            suffix: darwin-x64
          - os: windows-latest
            node: "24"
            archive: zip
            suffix: win32-x64
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Multi-process release stress (spec § 5.6)
        # Phase A Task 1 (#20): run the multi-process
        # stress test at the spec § 5.6 release profile
        # (8 workers × 1,250 ops = 10,000 total
        # operations) before packaging. The CI profile
        # (1,600 ops) runs on every push via ci.yml;
        # the release profile is opt-in here so the
        # candidate artefacts are exercised against
        # the full spec gate.
        #
        # v1.1.5 (v1.1.5 release): the v1.1.3 GATE-06
        # refactor moved the multi-process stress test
        # out of the default `vitest.config.ts` (it's
        # segregated into the per-suite
        # `vitest.stress.config.ts` so the 10k-op cost
        # is paid EXACTLY ONCE per release job — the
        # orchestrator pins the counter via `JOB_ID`).
        # The previous `npx vitest run
        # test/multi-process-stress.test.ts` invocation
        # used the default config which excludes the
        # stress test, so vitest reported `No test
        # files found` and the package job failed on
        # every OS leg. Use the dedicated per-suite
        # config (matches `npm run test:stress`).
        #
        # v1.1.6 follow-up B1 (issue #42, spec
        # d67fc45, plan bfbd2cb): the v1.1.5
        # windows-latest skip is REMOVED. The
        # `withBusyRetry` async retry helper in
        # `src/sqlite-store.ts` covers the 8-worker
        # × 1,250-op release profile on every OS
        # (5 retries with 10ms → 200ms exponential
        # backoff, plus the existing 5000ms
        # `busy_timeout` PRAGMA absorbs the
        # single-writer wait). The Windows file
        # locking semantics are more aggressive
        # about short-lived `busy` returns during
        # 8-process contention, so the retry
        # budget is the right knob — the 1.5s
        # release.sh SHUTDOWN ceiling in the
        # v1.1.5 v1.1.5 release cycle stays
        # unchanged. Documented in the v1.1.6
        # CHANGELOG entry; this is the same-commit
        # revert of the v1.1.5 workaround.
        env:
          TMPDIR: ${{ runner.temp }}
          STRESS_PROFILE: release
        run: npx vitest run --config vitest.stress.config.ts

      - name: Strip dev-only artefacts
        shell: bash
        # The tarball/zip ships only what the user
        # needs at runtime: `dist/`, `package.json`,
        # `README.md`, and `LICENSE` (if present).
        # `node_modules/` is rebuilt by `npm install
        # --omit=dev` inside the smoke step.
        run: |
          set -euo pipefail
          STAGE="stage-agent-recall-${{ matrix.suffix }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist "$STAGE/dist"
          cp package.json "$STAGE/package.json"
           cp README.md "$STAGE/README.md"
           cp CHANGELOG.md "$STAGE/CHANGELOG.md"
           cp LICENSE "$STAGE/LICENSE"
          echo "package contents:"
          find "$STAGE" -maxdepth 3 -type f | sort

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          STAGE="stage-agent-recall-${{ matrix.suffix }}"
          if [ "${{ matrix.archive }}" = "tar" ]; then
            tar -czf "agent-recall-${VERSION}-${{ matrix.suffix }}.tar.gz" -C "$STAGE" .
          else
            # v1.1.5 (v1.1.5 release): the Windows
            # runner does not have the `zip` command
            # on PATH (Git Bash ships without it).
            # The previous `(cd "$STAGE" && zip -r
            # "..." .)` invocation crashed with
            # `zip: command not found` (exit 127).
            # Use PowerShell's `Compress-Archive`
            # instead — the same call the
            # release-candidate.yml `packaged-artifact`
            # job uses (so the cross-platform pack
            # path is identical between the rc and
            # tag flows).
            powershell -NoProfile -Command "Compress-Archive -Path '${STAGE}\*' -DestinationPath 'agent-recall-${VERSION}-${{ matrix.suffix }}.zip' -Force"
          fi
          ls -la "agent-recall-${VERSION}-${{ matrix.suffix }}."*

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: agent-recall-${{ matrix.suffix }}
          # Stage 16 v1.1.1 PR-8 (issue #16, spec § 11.2):
          # the glob matches the platform-correct
          # archive type. Pre-PR-8 the path glob was
          # `agent-recall-*.tar.gz`, which silently
          # dropped the Windows `.zip` artefacts
          # (the upload step then failed with
          # `if-no-files-found: error` on the windows
          # matrix leg). The matrix-entry `archive`
          # flag drives the extension; both globs
          # are listed so a tarball matrix entry that
          # accidentally produces a zip (or vice
          # versa) still gets uploaded.
          path: |
            agent-recall-*.tar.gz
            agent-recall-*.zip
          if-no-files-found: error
          retention-days: 14

  verify-extracted-artifacts:
    # Stage 18 v1.1.2 (issue #28, task 9): the
    # final cross-platform gate. Downloads every
    # platform archive produced by the `package`
    # matrix, re-extracts each, recomputes the
    # SHA-256 hashes via `compute-artifact-hashes.mjs`
    # (the same dependency-free script the candidate
    # workflow uses), and runs the full
    # extracted-artifact MCP lifecycle
    # (`test/blackbox/packaged-install.test.ts`)
    # against each one. A failure on ANY platform
    # blocks the tag (the job `needs: package`, so
    # the `smoke` matrix cannot start before this
    # gate is green).
    name: Extracted artifact lifecycle ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
    steps:
      - name: Checkout exact tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Determine platform suffix
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX="win32-x64"; ARCHIVE_TYPE="zip"; PLATFORM_TAG="win32"
          elif [ "$RUNNER_OS" = "macOS" ]; then SUFFIX="darwin-x64"; ARCHIVE_TYPE="tar"; PLATFORM_TAG="darwin"
          else SUFFIX="linux-x64"; ARCHIVE_TYPE="tar"; PLATFORM_TAG="linux"; fi
          echo "SUFFIX=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_TYPE=${ARCHIVE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "PLATFORM_TAG=${PLATFORM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download platform package
        uses: actions/download-artifact@v4
        with:
          name: agent-recall-${{ steps.platform.outputs.SUFFIX }}
          path: pkg

      - name: Extract platform package
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          AGENT_RECALL_PACKAGED_ARTIFACT: pkg/agent-recall-*${{ steps.platform.outputs.SUFFIX }}
          AGENT_RECALL_EXTRACT_DIR: ${{ runner.temp }}/agent-recall-extracted-${{ steps.platform.outputs.SUFFIX }}
          AGENT_RECALL_PLATFORM: ${{ steps.platform.outputs.PLATFORM_TAG }}
        run: |
          set -euo pipefail
          ARTIFACT=$(ls pkg/agent-recall-*.$([ "${{ steps.platform.outputs.ARCHIVE_TYPE }}" = "tar" ] && echo "tar.gz" || echo "zip") | head -n 1)
          echo "artifact: $ARTIFACT"
          AGENT_RECALL_PACKAGED_ARTIFACT="$ARTIFACT" \
          AGENT_RECALL_EXTRACT_DIR="$RUNNER_TEMP/agent-recall-extracted-${{ steps.platform.outputs.SUFFIX }}" \
          AGENT_RECALL_PLATFORM="${{ steps.platform.outputs.PLATFORM_TAG }}" \
            node scripts/extract-release-artifact.mjs

      - name: Re-verify SHA-256 against the platform archive
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          MATRIX_OS: ${{ matrix.os }}
          RELEASE_HASHES_OUTPUT: ${{ runner.temp }}/release-artifact-hashes-${{ steps.platform.outputs.SUFFIX }}.json
        run: |
          set -euo pipefail
          ARTIFACT=$(ls pkg/agent-recall-*.$([ "${{ steps.platform.outputs.ARCHIVE_TYPE }}" = "tar" ] && echo "tar.gz" || echo "zip") | head -n 1)
          node scripts/compute-artifact-hashes.mjs "$ARTIFACT"
          cat "$RUNNER_TEMP/release-artifact-hashes-${{ steps.platform.outputs.SUFFIX }}.json"

      - name: Install runtime deps in extracted artifact
        working-directory: ${{ runner.temp }}/agent-recall-extracted-${{ steps.platform.outputs.SUFFIX }}
        run: npm install --omit=dev

      - name: Extracted-artifact MCP lifecycle E2E
        # Stage 18 v1.1.2 (issue #28, task 9):
        # the 11-scenario MCP lifecycle against the
        # EXTRACTED artifact on this platform. The
        # Core profile is the packaged default;
        # the test asserts the Core tool list
        # surfaces, the extended / admin profiles
        # round-trip cleanly when the env vars +
        # capability flip, and clean shutdown
        # produces zero stderr.
        #
        # v1.1.5 (v1.1.5 release): the v1.1.3 GATE-06
        # refactor moved the packaged-install lifecycle
        # into the per-suite
        # `vitest.packaged-artifact.config.ts` (the
        # default config excludes it because the
        # lifecycle requires
        # `AGENT_RECALL_EXTRACTED_ARTIFACT` + a real
        # extracted archive on disk). The previous
        # `npx vitest run
        # test/blackbox/packaged-install.test.ts`
        # invocation used the default config which
        # excludes the test, so vitest reported
        # `No test files found` and the lifecycle
        # job failed on every OS leg. Use the
        # dedicated per-suite config (matches
        # `npm run test:packaged-artifact`).
        shell: bash
        env:
          CI: "true"
          AGENT_RECALL_SUPPRESS_MCP_DEPRECATION: "1"
          AGENT_RECALL_EXTRACTED_ARTIFACT: ${{ runner.temp }}/agent-recall-extracted-${{ steps.platform.outputs.SUFFIX }}
        run: |
          set -euo pipefail
          npx vitest run --config vitest.packaged-artifact.config.ts

  smoke:
    name: Smoke ${{ matrix.os }}
    needs: [package, verify-extracted-artifacts]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            archive: tar
            smoke_cmd: "node dist/bin/agent-recall.js"
          - os: macos-latest
            suffix: darwin-x64
            archive: tar
            smoke_cmd: "node dist/bin/agent-recall.js"
          - os: windows-latest
            suffix: win32-x64
            archive: zip
            smoke_cmd: "node dist/bin/agent-recall.js"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: agent-recall-${{ matrix.suffix }}
          path: pkg

      - name: Extract
        shell: bash
        env:
          AGENT_RECALL_PACKAGED_ARTIFACT: ${{ runner.temp }}/smoke-package
          AGENT_RECALL_EXTRACT_DIR: ${{ runner.temp }}/smoke-extracted
          AGENT_RECALL_PLATFORM: ${{ matrix.os == 'windows-latest' && 'win32' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke-package"
          ARTIFACT=$(find pkg -maxdepth 1 -type f | head -n 1)
          cp "$ARTIFACT" "$RUNNER_TEMP/smoke-package/$(basename "$ARTIFACT")"
          export AGENT_RECALL_PACKAGED_ARTIFACT="$RUNNER_TEMP/smoke-package/$(basename "$ARTIFACT")"
          node scripts/extract-release-artifact.mjs
          rm -rf pkg
          mv "$RUNNER_TEMP/smoke-extracted" pkg

      - name: Install runtime deps (production only)
        working-directory: pkg
        run: npm install --omit=dev

      - name: CLI smoke
        working-directory: pkg
        run: ${{ matrix.smoke_cmd }} help

      - name: CLI doctor smoke
        working-directory: pkg
        run: ${{ matrix.smoke_cmd }} doctor

      - name: MCP server smoke
        # The MCP server is a stdio JSON-RPC endpoint.
        # We don't speak MCP here; we just confirm it
        # starts and shuts down cleanly when stdin
        # closes. A real client would negotiate the
        # handshake via the MCP SDK; this gate only
        # checks that the entry point runs.
        working-directory: pkg
        shell: bash
        run: |
          set -euo pipefail
          # Use a Node-based kill timer so the smoke
          # step is identical on all three OSes.
          node -e '
            const { spawn } = require("node:child_process");
            const child = spawn(process.execPath, ["dist/src/index.js"], { stdio: ["ignore", "inherit", "inherit"] });
            const timer = setTimeout(() => child.kill("SIGTERM"), 3000);
            child.on("exit", (code, signal) => {
              clearTimeout(timer);
              // We only require that the process
              // started; both clean exit (0) and
              // signal-terminated (SIGTERM) are OK.
              if (signal !== null) {
                console.log("MCP entry point started; timer killed it cleanly");
                process.exit(0);
              }
              console.log("MCP entry point exited with code " + code);
              process.exit(code === 0 ? 0 : 1);
            });
            child.on("error", (err) => {
              clearTimeout(timer);
              console.error("MCP entry point failed to start: " + err.message);
              process.exit(1);
            });
          '
