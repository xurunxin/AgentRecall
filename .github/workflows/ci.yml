# .github/workflows/ci.yml
#
# Stage 13 PR11 (spec § 11.2): the cross-platform CI
# matrix. The job matrix is `os × node`, where node
# is pinned to the project's `engines.node` minimum
# (24.x — see package.json). When the project bumps
# its minimum, edit `node-version` in one place.
#
# Test layers (per spec § 11.2):
#   - typecheck (tsc --noEmit, fastest)
#   - unit (vitest, full suite)
#   - build (tsc, gates the dist/ output that the
#     packaging smoke job will use)
#   - cross-platform paths (concrete OS-specific
#     checks: case-insensitive on win/mac, reserved
#     names on win, etc.)
#
# The matrix exercises:
#   ubuntu-latest × Node 24
#   windows-latest × Node 24
#   macos-latest × Node 24
# = 3 jobs. The plan called for 3 OS × 2 Node, but
# the project's engines field pins the Node version
# to 24, so the matrix collapses to a single Node
# version. If we later widen engines to e.g. >=22,
# add a second `node-version` entry and this file
# becomes 6 jobs automatically.

name: CI

on:
  push:
    branches: [main, "rc-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + integration tests
        run: npx vitest run --pool=forks --poolOptions.forks.singleFork
        env:
          # The vitest runs spawn many short-lived
          # sqlite databases under the system temp
          # dir; on Windows the per-user temp path is
          # fine, on linux the runner image ships a
          # fast tmpfs at /tmp.
          TMPDIR: ${{ runner.temp }}
          # Phase A Task 1 (#20): the CI profile keeps
          # the multi-process stress test at the spec
          # § 5.6 CI sample of 8 workers × 200 ops =
          # 1,600 total operations. The release profile
          # (8 × 1,250 = 10,000) is opt-in via the
          # release workflow.
          STRESS_PROFILE: ci

      - name: MCP black-box E2E
        # Stage 15 PR-M2-1 (issue #8, spec § 11.2):
        # spawn the built MCP server via stdio, connect
        # with the SDK's Client, and run the full
        # remember/update(CAS)/forget(idempotency)
        # lifecycle against a real MCP transport. This
        # is the gate that proves the *built artifact*
        # is functional, not just the source.
        shell: bash
        run: |
          set -euo pipefail
          ls dist/src/index.js
          npx vitest run test/blackbox/mcp-client-e2e.test.ts

      - name: Export round-trip smoke
        # The portability contract (spec § 6.7): an
        # export written by the same build must
        # round-trip through import without losing
        # entries. This is the lightweight cross-OS
        # gate; the heavier per-feature portability
        # tests live in test/portability*.test.ts and
        # run under `npm test` above.
        #
        # Stage 16 v1.1.1 PR-8 (issue #16, spec § 11.2):
        # the pre-PR-8 step used a shell suppressor on the
        # export line, which silently swallowed
        # export failures. PR-8 removes the
        # suppressor: a failure to export is a
        # real failure that blocks the cross-OS
        # release gate.
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_HOME="$(mktemp -d)"
          export AGENT_RECALL_HOME="$SMOKE_HOME"
          echo "smoke data home: $AGENT_RECALL_HOME"
          npx tsx bin/agent-recall.ts help > /dev/null
          npx tsx bin/agent-recall.ts export --scope global > /dev/null
          ls -la "$AGENT_RECALL_HOME"

      - name: Candidate release-critical gates
        if: ${{ startsWith(github.ref, 'refs/heads/rc-') }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          CI: "true"
          STRESS_PROFILE: release
          AGENT_RECALL_SUPPRESS_MCP_DEPRECATION: "1"
        run: |
          set -euo pipefail
          npx vitest run test/multi-process-stress.test.ts
          npx vitest run \
            test/sqlite-store-migration.test.ts \
            test/sqlite-store-migration-v3.test.ts \
            test/release-gate/p0-migration.test.ts \
            test/release-gate/p0-migration-backup.test.ts \
            test/backup.test.ts \
            test/cli/backup.test.ts \
            test/release-gate/p0-backup.test.ts \
            test/release-gate/p0-cleanup.test.ts \
            test/release-gate/p1-atomic-import.test.ts \
            test/release-gate/p3-strict-import.test.ts \
            test/release-gate/p3-full-history-import.test.ts \
            test/release-gate/p3-import-preflight-budget.test.ts \
            test/release-gate/p3-import-batch-lineage.test.ts \
            test/cli/import-preflight.test.ts \
            test/blackbox/mcp-client-e2e.test.ts \
            test/blackbox/mcp-client-e2e-extended.test.ts \
            test/blackbox/mcp-all-tools-e2e-core.test.ts \
            test/blackbox/mcp-all-tools-e2e-extended.test.ts \
            test/release-gate/admin-default/mcp-admin-default.test.ts
          npm run verify:artifacts

      - name: Cross-platform path safety check


        # On Windows / macOS the filesystem is
        # case-insensitive by default. The portability
        # filename map is case-sensitive by design
        # (lowercased slug + 8-char hex); this step
        # guards against a future regression where
        # a topic's slug happens to collide with the
        # upper-cased form of another.
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # CON / PRN / AUX / NUL are reserved on
            # NTFS; the portability tests already
            # cover them, but a quick filesystem probe
            # confirms the runner image matches.
            echo "Windows reserved name probe:"
            ls -la //./NUL 2>/dev/null || echo "  //./NUL: not present (expected on runners)"
          fi
          # Sanity: case-insensitive fs (mac/windows)
          # must NOT collapse our slugs.
          TMP_CASE="$(mktemp -d)"
          echo "General" > "$TMP_CASE/General"
          echo "general" > "$TMP_CASE/general"
          COUNT=$(ls "$TMP_CASE" | wc -l | tr -d ' ')
          if [ "$COUNT" = "2" ]; then
            echo "case-sensitive fs: ok"
          else
            echo "case-INsensitive fs detected ($COUNT files); this is expected on mac/windows"
          fi
          rm -rf "$TMP_CASE"
