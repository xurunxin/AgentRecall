name: Link v1.1.3 native sub-issues

on:
  push:
    branches: ["rc-link-v1.1.3-subissues"]

permissions:
  contents: read
  issues: write

jobs:
  link-native-subissues:
    runs-on: ubuntu-latest
    steps:
      - name: Add and verify native GitHub Sub-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const parentNumber = 30;
            const childNumbers = [31, 32, 33, 34, 35, 36, 37, 38];

            for (const childNumber of childNumbers) {
              const child = await github.rest.issues.get({
                owner,
                repo,
                issue_number: childNumber,
              });
              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                  {
                    owner,
                    repo,
                    issue_number: parentNumber,
                    sub_issue_id: child.data.id,
                    headers: {
                      accept: 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2026-03-10',
                    },
                  },
                );
              } catch (error) {
                if (error.status !== 409 && error.status !== 422) throw error;
              }
            }

            const linked = await github.request(
              'GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
              {
                owner,
                repo,
                issue_number: parentNumber,
                per_page: 100,
                headers: {
                  accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2026-03-10',
                },
              },
            );
            const linkedNumbers = new Set(linked.data.map((issue) => issue.number));
            const missing = childNumbers.filter((number) => !linkedNumbers.has(number));
            if (missing.length > 0) {
              core.setFailed(`Native sub-issue verification failed; missing: ${missing.join(', ')}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: parentNumber,
              body:
                `Native GitHub Sub-issues linked and verified: ${childNumbers.map((n) => `#${n}`).join(', ')}.\n\n` +
                `Verification workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
