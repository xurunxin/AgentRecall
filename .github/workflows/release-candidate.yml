name: Link v1.1.3 native sub-issues

on:
  push:
    branches: ["rc-link-v1.1.3-subissues"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  link-native-subissues:
    runs-on: ubuntu-latest
    steps:
      - name: Add and verify native GitHub Sub-issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const parentNumber = 30;
            const childNumbers = [31, 32, 33, 34, 35, 36, 37, 38];

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: parentNumber,
              body: `Native Sub-issues linker started: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

            const diagnostics = [];
            for (const childNumber of childNumbers) {
              try {
                const child = await github.rest.issues.get({ owner, repo, issue_number: childNumber });
                await github.request(
                  'POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                  {
                    owner,
                    repo,
                    issue_number: parentNumber,
                    sub_issue_id: child.data.id,
                    headers: {
                      accept: 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2026-03-10',
                    },
                  },
                );
                diagnostics.push(`#${childNumber}: linked`);
              } catch (error) {
                diagnostics.push(`#${childNumber}: status=${error.status ?? 'unknown'} message=${error.message}`);
              }
            }

            let linkedNumbers = [];
            try {
              const linked = await github.request(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                {
                  owner,
                  repo,
                  issue_number: parentNumber,
                  per_page: 100,
                  headers: {
                    accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2026-03-10',
                  },
                },
              );
              linkedNumbers = linked.data.map((issue) => issue.number);
            } catch (error) {
              diagnostics.push(`GET sub_issues: status=${error.status ?? 'unknown'} message=${error.message}`);
            }

            const missing = childNumbers.filter((number) => !linkedNumbers.includes(number));
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: parentNumber,
              body:
                `Native Sub-issues linker diagnostics:\n\n${diagnostics.map((line) => `- ${line}`).join('\n')}\n\n` +
                `Verified linked issues: ${linkedNumbers.map((n) => `#${n}`).join(', ') || '(none)'}.\n` +
                `Missing: ${missing.map((n) => `#${n}`).join(', ') || '(none)'}.`,
            });

            if (missing.length > 0) {
              core.setFailed(`Native sub-issue verification failed; missing: ${missing.join(', ')}`);
            }
