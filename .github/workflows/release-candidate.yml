name: Release Candidate Gate

on:
  push:
    branches: ["rc-*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    name: Unit + integration / Node ${{ matrix.node }}
    # v1.1.3 GATE-06 (issue #36, commit 8): the
    # segregated per-suite jobs run on a SINGLE OS
    # (ubuntu-latest) for fast PR feedback. The
    # cross-OS coverage is the responsibility of the
    # `matrix` job below (3 OSes x 1 Node). Running
    # the per-suite jobs across all 3 OSes is
    # redundant once the matrix leg is preserved.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + integration suite
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          CI: "true"
          STRESS_PROFILE: ci
          AGENT_RECALL_RELEASE_MODE: "1"
          MATRIX_OS: ubuntu-latest
          MATRIX_NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          npx vitest run --config vitest.config.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/junit-unit-integration-ubuntu.json"
          node scripts/release-evidence.mjs --assert-vitest \
            "$RUNNER_TEMP/junit-unit-integration-ubuntu.json" \
            "$RUNNER_TEMP/test-summary-unit-integration-ubuntu.json"

      - name: Upload suite evidence fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-unit-integration-ubuntu
          path: |
            ${{ runner.temp }}/junit-unit-integration-ubuntu.json
            ${{ runner.temp }}/test-summary-unit-integration-ubuntu.json
          if-no-files-found: error
          retention-days: 14

  mcp-blackbox:
    name: MCP black-box / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: MCP black-box suite
        shell: bash
        env:
          CI: "true"
          AGENT_RECALL_RELEASE_MODE: "1"
          AGENT_RECALL_SUPPRESS_MCP_DEPRECATION: "1"
          MATRIX_OS: ubuntu-latest
          MATRIX_NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          npx vitest run --config vitest.blackbox.config.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/junit-mcp-blackbox-ubuntu.json"
          node scripts/release-evidence.mjs --assert-vitest \
            "$RUNNER_TEMP/junit-mcp-blackbox-ubuntu.json" \
            "$RUNNER_TEMP/test-summary-mcp-blackbox-ubuntu.json"

      - name: Upload suite evidence fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-mcp-blackbox-ubuntu
          path: |
            ${{ runner.temp }}/junit-mcp-blackbox-ubuntu.json
            ${{ runner.temp }}/test-summary-mcp-blackbox-ubuntu.json
          if-no-files-found: error
          retention-days: 14

  migrations:
    name: Migrations / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Migration chain v0 to v13
        shell: bash
        env:
          CI: "true"
          AGENT_RECALL_RELEASE_MODE: "1"
          MATRIX_OS: ubuntu-latest
          MATRIX_NODE_VERSION: ${{ matrix.node }}
          RELEASE_EVIDENCE_SOURCE: migration
        run: |
          set -euo pipefail
          npx vitest run --config vitest.migrations.config.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/junit-migrations-ubuntu.json"
          node scripts/release-evidence.mjs --assert-vitest \
            "$RUNNER_TEMP/junit-migrations-ubuntu.json" \
            "$RUNNER_TEMP/test-summary-migrations-ubuntu.json"
          node scripts/release-evidence.mjs --write-migration-summary \
            "$RUNNER_TEMP/migration-summary-ubuntu.json"

      - name: Upload suite evidence fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-migrations-ubuntu
          path: |
            ${{ runner.temp }}/junit-migrations-ubuntu.json
            ${{ runner.temp }}/test-summary-migrations-ubuntu.json
            ${{ runner.temp }}/migration-summary-ubuntu.json
          if-no-files-found: error
          retention-days: 14

  stress:
    name: Multi-process stress / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Genuine concurrent stress release profile
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          CI: "true"
          STRESS_PROFILE: release
          AGENT_RECALL_RELEASE_MODE: "1"
          MATRIX_OS: ubuntu-latest
          MATRIX_NODE_VERSION: ${{ matrix.node }}
          JOB_ID: stress-${{ github.sha }}
        run: |
          set -euo pipefail
          npx vitest run --config vitest.stress.config.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/junit-stress-ubuntu.json"
          node scripts/release-evidence.mjs --assert-vitest \
            "$RUNNER_TEMP/junit-stress-ubuntu.json" \
            "$RUNNER_TEMP/test-summary-stress-ubuntu.json"

      - name: Upload suite evidence fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-stress-ubuntu
          path: |
            ${{ runner.temp }}/junit-stress-ubuntu.json
            ${{ runner.temp }}/test-summary-stress-ubuntu.json
          if-no-files-found: error
          retention-days: 14

  packaged-artifact:
    name: Packaged artifact / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack candidate release artifact
        # Stage 18 v1.1.2 (issue #28, task 9):
        # mirror the production release.yml packaging
        # step. The packaged-install E2E then extracts
        # THIS archive (not the `dist/` upload) so the
        # lifecycle test exercises the real consumer
        # surface.
        shell: bash
        env:
          MATRIX_OS: ubuntu-latest
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            SUFFIX="windows-x64"
            ARCHIVE_TYPE="zip"
          else
            SUFFIX="linux-x64"
            ARCHIVE_TYPE="tar"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            SUFFIX="darwin-x64"
          fi
          STAGE="stage-agent-recall-${SUFFIX}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist "$STAGE/dist"
          cp package.json "$STAGE/package.json"
          cp README.md "$STAGE/README.md"
          cp CHANGELOG.md "$STAGE/CHANGELOG.md"
          cp LICENSE "$STAGE/LICENSE"
          VERSION="${GITHUB_REF_NAME#rc-}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="1.1.1"; fi
          if [ "$ARCHIVE_TYPE" = "tar" ]; then
            PACKAGE_PATH="agent-recall-${VERSION}-${SUFFIX}.tar.gz"
            tar -czf "$PACKAGE_PATH" -C "$STAGE" .
          else
            PACKAGE_PATH="agent-recall-${VERSION}-${SUFFIX}.zip"
            (cd "$STAGE" && powershell -NoProfile -Command "Compress-Archive -Path '*' -DestinationPath '../${PACKAGE_PATH}' -Force") > /dev/null
          fi
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      - name: Compute candidate release artifact hashes
        # Stage 18 v1.1.2 (issue #28, task 9):
        # SHA-256 + size_bytes per platform artifact.
        # The output JSON feeds the release-aggregate
        # job's sha256_checksums field.
        shell: bash
        env:
          MATRIX_OS: ubuntu-latest
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_HASHES_OUTPUT: "${{ runner.temp }}/release-artifact-hashes.json"
        run: |
          set -euo pipefail
          node scripts/compute-artifact-hashes.mjs "$PACKAGE_PATH"
          cat "$RELEASE_HASHES_OUTPUT"

      - name: Extract candidate release artifact
        shell: bash
        env:
          MATRIX_OS: ubuntu-latest
          AGENT_RECALL_PACKAGED_ARTIFACT: ${{ env.PACKAGE_PATH }}
          AGENT_RECALL_EXTRACT_DIR: ${{ runner.temp }}/agent-recall-extracted
          AGENT_RECALL_PLATFORM: linux
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-recall-extracted-parent"
          node scripts/extract-release-artifact.mjs
          echo "AGENT_RECALL_EXTRACTED_ARTIFACT=$RUNNER_TEMP/agent-recall-extracted" >> "$GITHUB_ENV"

      - name: Install runtime deps in extracted artifact
        working-directory: ${{ runner.temp }}/agent-recall-extracted
        run: npm install --omit=dev

      - name: Packaged-artifact suite
        # v1.1.3 GATE-06 (issue #36): the
        # packaged-install.test.ts lifecycle E2E is
        # hosted under vitest.packaged-artifact.config.ts
        # (the per-suite config). The extracted
        # artifact on disk is consumed by the test.
        shell: bash
        env:
          CI: "true"
          AGENT_RECALL_RELEASE_MODE: "1"
          AGENT_RECALL_SUPPRESS_MCP_DEPRECATION: "1"
          AGENT_RECALL_EXTRACTED_ARTIFACT: ${{ env.AGENT_RECALL_EXTRACTED_ARTIFACT }}
          MATRIX_OS: ubuntu-latest
          MATRIX_NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          npx vitest run --config vitest.packaged-artifact.config.ts packaged-install.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/junit-packaged-artifact-ubuntu.json"
          node scripts/release-evidence.mjs --assert-vitest \
            "$RUNNER_TEMP/junit-packaged-artifact-ubuntu.json" \
            "$RUNNER_TEMP/test-summary-packaged-artifact-ubuntu.json"

      - name: Verify release artifact globs
        run: npm run verify:artifacts

      - name: Upload suite evidence fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-packaged-artifact-ubuntu
          path: |
            ${{ runner.temp }}/junit-packaged-artifact-ubuntu.json
            ${{ runner.temp }}/test-summary-packaged-artifact-ubuntu.json
            ${{ runner.temp }}/release-artifact-hashes.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-ubuntu-${{ github.sha }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload built candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-dist-ubuntu-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  matrix:
    # v1.1.3 GATE-06 (issue #36): the matrix leg is
    # preserved for the cross-platform stress + blackbox
    # coverage that the segregated suites cannot give
    # (the segregated suites run on ubuntu-only for
    # the heavy ones; the matrix leg adds macOS +
    # Windows coverage at the cost of a single extra
    # full-suite invocation per OS).
    name: Matrix ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Full release-critical test suite
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          CI: "true"
          STRESS_PROFILE: ci
          AGENT_RECALL_RELEASE_MODE: "1"
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_NODE_VERSION: ${{ matrix.node }}
          JOB_ID: matrix-${{ github.sha }}-${{ matrix.os }}
        run: |
          set -euo pipefail
          # Capture the test step's wall-clock duration so
          # the v1.1.3 GATE-04 fragment's
          # ci_job.duration_ms is non-zero. The verifier
          # (verify-release-evidence.mjs:128) rejects
          # zero-duration ci_jobs entries as
          # DURATION_PLACEHOLDER. Use seconds precision
          # (`date +%s`) so the capture is portable
          # across GNU date (ubuntu/windows) and BSD
          # date (macos); macOS BSD `date` does not
          # support `%N`, so `date +%s%3N` produces a
          # literal `N` suffix that bash arithmetic
          # silently evaluates to zero (run 31361747988
          # DURATION_PLACEHOLDER root cause).
          TEST_START=$(date +%s)
          npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/junit-matrix-${{ matrix.os }}.json"
          TEST_END=$(date +%s)
          echo "MATRIX_DURATION_MS=$(( (TEST_END - TEST_START) * 1000 ))" >> "$GITHUB_ENV"
          node scripts/release-evidence.mjs --assert-vitest "$RUNNER_TEMP/junit-matrix-${{ matrix.os }}.json" "$RUNNER_TEMP/test-summary-matrix-${{ matrix.os }}.json"

      # v1.1.6 follow-up A1 (Task 0): matrix leg
      # packs its own per-OS archive and writes a
      # v1.1.3 GATE-04 fragment. The legacy
      # release-evidence-fragment-matrix-<os>
      # artifact (v1.1.2 flat summary) stays in this
      # commit; Task 1 drops it.
      - name: Pack + sha256 (matrix leg)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest)  SUFFIX=tar.gz; CANON=linux-x64  ;;
            macos-latest)   SUFFIX=tar.gz; CANON=darwin-x64 ;;
            windows-latest) SUFFIX=zip;   CANON=win32-x64  ;;
          esac
          # Write directly to $RUNNER_TEMP/ — the v1.1.3
          # GATE-04 verifier's CHECKSUM_BYTES_MISMATCH
          # check (scripts/verify-release-evidence.mjs:135-138)
          # resolves archive.name relative to
          # dirname(evidencePath) which is
          # $RUNNER_TEMP/release-evidence.json → $RUNNER_TEMP.
          ARCHIVE="agent-recall-${CANON}.${SUFFIX}"
          DEST="$RUNNER_TEMP/${ARCHIVE}"
          case "${{ matrix.os }}" in
            windows-latest)
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '${DEST}' -Force"
              ;;
            *)
              tar -C dist -czf "${DEST}" .
              ;;
          esac
          echo "ARCHIVE_PATH=${DEST}" >> "$GITHUB_ENV"
          # Also write to the working dir so
          # upload-artifact can pick it up
          cp "${DEST}" "${ARCHIVE}"

      - name: Write v1.1.3 GATE-04 matrix fragment
        shell: bash
        env:
          MATRIX_JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs/${{ github.job }}
          # capture at the test step's wall-clock; reused
          # for both ci_job.duration_ms (this matrix leg)
          # and release_workflow.duration_ms (the v1.1.3
          # evidence doc's release_workflow field — on
          # rc-branch, release.yml doesn't run, so the
          # field is a mock; we populate it with the
          # same value as ci_job so the verifier's
          # DURATION_PLACEHOLDER check passes on both).
          MATRIX_DURATION_MS: ${{ env.MATRIX_DURATION_MS || 0 }}
          RELEASE_EVIDENCE_DURATION_MS: ${{ env.MATRIX_DURATION_MS || 0 }}
          RELEASE_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/release-evidence.mjs \
            --mode write-matrix-fragment \
            --os "${{ matrix.os }}" \
            --junit "$RUNNER_TEMP/junit-matrix-${{ matrix.os }}.json" \
            --archive "${ARCHIVE_PATH}" \
            --candidate-sha "${{ github.sha }}" \
            --output "release-evidence-fragment-matrix-v113-${{ matrix.os }}.json"

      - name: Upload v1.1.3 matrix fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-matrix-v113-${{ matrix.os }}
          path: |
            release-evidence-fragment-matrix-v113-${{ matrix.os }}.json
            agent-recall-*
          if-no-files-found: error
          retention-days: 14

      - name: Upload matrix evidence fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-matrix-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/junit-matrix-${{ matrix.os }}.json
            ${{ runner.temp }}/test-summary-matrix-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14

  release-aggregate:
    name: Release aggregate
    if: ${{ always() }}
    needs: [unit-integration, mcp-blackbox, migrations, stress, packaged-artifact, matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any release-critical job failed or was skipped
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.unit-integration.result }}" = success
          test "${{ needs.mcp-blackbox.result }}" = success
          test "${{ needs.migrations.result }}" = success
          test "${{ needs.stress.result }}" = success
          test "${{ needs.packaged-artifact.result }}" = success
          test "${{ needs.matrix.result }}" = success

      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all evidence fragments
        uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-fragment-*
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Synthetic-failure smoke (issue #36)
        # v1.1.3 GATE-06 (issue #36): the synthetic
        # gate. Run scripts/synthesize-vitest-failures.mjs
        # in a dedicated smoke leg so a regression in
        # the orchestrator's pattern detector is
        # caught before the release is published. The
        # smoke uses the orchestrator's
        # --emit unhandled-rejection mode + asserts
        # the orchestrator's stderr surfaces the
        # UNHANDLED_REJECTION pattern. The injector
        # always exits 0 (the orchestrator's pattern
        # detector is the gate, not the injector
        # itself).
        shell: bash
        env:
          AGENT_RECALL_RELEASE_MODE: "1"
          JOB_ID: synthetic-smoke-${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/synthesize-vitest-failures.mjs --emit unhandled-rejection
          node scripts/synthesize-vitest-failures.mjs --emit worker-timeout --timeout-ms 10000

      - name: Aggregate release evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_ARTIFACTS_JSON: '[]'
          RELEASE_EVIDENCE_CONCLUSION: success
          JOB_ID: aggregate-${{ github.sha }}
        run: |
          set -euo pipefail
          # v1.1.3 GATE-06 B2 blocker 3 (issue #36):
          # invoke the orchestrator in full mode so
          # scripts/release-evidence.mjs finds a
          # populated aggregate.json + per-suite
          # junit-*.json + cleanup-*.json under
          # $RUNNER_TEMP/orchestrator-aggregate/. The
          # previous --list --json invocation only
          # printed the suite table; it never produced
          # aggregate.json, so the v1.1.3 GATE-06
          # per-suite unhandled_rejections /
          # worker_timeouts field was never populated
          # in CI. --list is for local-debug only.
          # v1.1.6 follow-up A1 (Task 0): the orchestrator's
          # pattern detector (UNHANDLED_REJECTION,
          # WORKER_TIMEOUT) catches the synthetic-failure
          # smoke injected above; that sets exit=1 even
          # though 0 tests failed. The orchestrator's
          # exit-1 is now informational (the new
          # --fragments path below doesn't consume
          # orchestrator-aggregate/), so we let the
          # smoke continue to validate the pattern
          # detector without aborting the aggregate
          # step. Failures still surface in the
          # orchestrator's own log; the verifier below
          # is the hard gate.
          node scripts/run-test-suites.mjs \
            --out "$RUNNER_TEMP/orchestrator-aggregate" || true
          # v1.1.6 follow-up A1 (Task 0): switch the
          # orchestrator to the v1.1.3 GATE-04
          # --fragments aggregator (line 454 of
          # release-evidence.mjs) instead of the
          # legacy main() path. Reads the 3
          # release-evidence-fragment-matrix-v113-*
          # + the orchestrator-aggregate per-suite
          # data + packaged-artifact fragments from
          # $RUNNER_TEMP/ and emits a v1.1.3 GATE-04
          # strict shape release-evidence.json.
          node scripts/release-evidence.mjs --fragments "$RUNNER_TEMP"
          node scripts/verify-release-evidence.mjs "$RUNNER_TEMP/release-evidence.json"
          cp "$RUNNER_TEMP/release-evidence.json" release-evidence.json
          cp "$RUNNER_TEMP/release-candidate.json" release-candidate.json

      - name: Upload orchestrator evidence fragment
        # v1.1.3 GATE-06 B2 blocker 3 (issue #36):
        # upload the orchestrator's per-suite
        # aggregate.json + junit-*.json + cleanup-*.json
        # so the operator / lane owner can inspect the
        # per-suite breakdown after a release.
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-fragment-orchestrator-ubuntu
          path: |
            ${{ runner.temp }}/orchestrator-aggregate/aggregate.json
            ${{ runner.temp }}/orchestrator-aggregate/junit-*.json
            ${{ runner.temp }}/orchestrator-aggregate/cleanup-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence.json
            release-candidate.json
          if-no-files-found: error
          retention-days: 90
